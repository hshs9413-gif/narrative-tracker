name: Python Tests

# 수집 스크립트를 고친 PR이 실제 수집(매일 07:30 KST)에서 처음 깨지지 않도록, 네트워크 없이 도는 테스트만 실행한다.
on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  # 저장소 Secret FRED_API_KEY로 실제 FRED API를 한 번 호출해 본다 — 키 인식·호출·유동성 시리즈 단위 확인용.
  # 데이터 파일은 쓰지 않는다. 같은 저장소 브랜치의 PR·main push·수동 실행에서만 Secret이 보인다(포크 PR 제외).
  fred-api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # 임시 진단: FRED 키가 어떤 이름으로 저장돼 있는지 후보 이름을 하나씩 확인한다 (Secret 이름은 대소문자 구분 없음).
      # 이름과 '값이 FRED 키 형식인지'만 출력하고 값은 출력하지 않는다.
      - name: Locate FRED key secret (candidate names, no values)
        env:
          S_FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          V_FRED_API_KEY: ${{ vars.FRED_API_KEY }}
          S_FRED_KEY: ${{ secrets.FRED_KEY }}
          V_FRED_KEY: ${{ vars.FRED_KEY }}
          S_FRED_API: ${{ secrets.FRED_API }}
          V_FRED_API: ${{ vars.FRED_API }}
          S_FRED: ${{ secrets.FRED }}
          V_FRED: ${{ vars.FRED }}
          S_FREDAPI: ${{ secrets.FREDAPI }}
          V_FREDAPI: ${{ vars.FREDAPI }}
          S_FRED_APIKEY: ${{ secrets.FRED_APIKEY }}
          V_FRED_APIKEY: ${{ vars.FRED_APIKEY }}
          S_FREDAPIKEY: ${{ secrets.FREDAPIKEY }}
          V_FREDAPIKEY: ${{ vars.FREDAPIKEY }}
          S_FRED_TOKEN: ${{ secrets.FRED_TOKEN }}
          V_FRED_TOKEN: ${{ vars.FRED_TOKEN }}
          S_FRED_API_TOKEN: ${{ secrets.FRED_API_TOKEN }}
          V_FRED_API_TOKEN: ${{ vars.FRED_API_TOKEN }}
          S_FRED_SECRET: ${{ secrets.FRED_SECRET }}
          V_FRED_SECRET: ${{ vars.FRED_SECRET }}
          S_FED_API_KEY: ${{ secrets.FED_API_KEY }}
          V_FED_API_KEY: ${{ vars.FED_API_KEY }}
          S_FED_API: ${{ secrets.FED_API }}
          V_FED_API: ${{ vars.FED_API }}
          S_FED_KEY: ${{ secrets.FED_KEY }}
          V_FED_KEY: ${{ vars.FED_KEY }}
          S_FEDAPI: ${{ secrets.FEDAPI }}
          V_FEDAPI: ${{ vars.FEDAPI }}
          S_FED_APIKEY: ${{ secrets.FED_APIKEY }}
          V_FED_APIKEY: ${{ vars.FED_APIKEY }}
          S_FED_TOKEN: ${{ secrets.FED_TOKEN }}
          V_FED_TOKEN: ${{ vars.FED_TOKEN }}
          S_FEDERAL_RESERVE_API_KEY: ${{ secrets.FEDERAL_RESERVE_API_KEY }}
          V_FEDERAL_RESERVE_API_KEY: ${{ vars.FEDERAL_RESERVE_API_KEY }}
          S_STLOUISFED_API_KEY: ${{ secrets.STLOUISFED_API_KEY }}
          V_STLOUISFED_API_KEY: ${{ vars.STLOUISFED_API_KEY }}
          S_API_KEY: ${{ secrets.API_KEY }}
          V_API_KEY: ${{ vars.API_KEY }}
          S_APIKEY: ${{ secrets.APIKEY }}
          V_APIKEY: ${{ vars.APIKEY }}
        run: |
          python - <<'PY'
          import os, re
          pat = re.compile(r"^[a-z0-9]{32}$")
          found = []
          for k, v in sorted(os.environ.items()):
              if not (k.startswith("S_") or k.startswith("V_")) or not v:
                  continue
              v = v.strip().strip("'\"").strip()
              kind = "secret" if k.startswith("S_") else "variable"
              found.append(f"{kind} {k[2:]} (len={len(v)}, fred_key_format={'yes' if pat.match(v) else 'no'})")
          print("::notice title=fred-key-candidates::" + ("; ".join(found) if found else "후보 이름 중 값이 있는 것 없음"))
          PY

      - name: Check FRED API with repository secret
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || vars.FRED_API_KEY }}
        run: python scripts/fred_check.py
