name: Python Tests

# 수집 스크립트를 고친 PR이 실제 수집(매일 07:30 KST)에서 처음 깨지지 않도록, 네트워크 없이 도는 테스트만 실행한다.
on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  # 저장소 Secret FRED_API_KEY로 실제 FRED API를 한 번 호출해 본다 — 키 인식·호출·유동성 시리즈 단위 확인용.
  # 데이터 파일은 쓰지 않는다. 같은 저장소 브랜치의 PR·main push·수동 실행에서만 Secret이 보인다(포크 PR 제외).
  fred-api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Check FRED API with repository secret
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || vars.FRED_API_KEY }}
        run: python scripts/fred_check.py

      - name: Compare CSV VIX with FRED VIXCLS (dry run)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || vars.FRED_API_KEY }}
        run: python scripts/resync_fred.py --columns vix --dry-run

  # 공공데이터포털 금융위원회 API(기업기본정보·기업 재무정보) 점검 — 키 인식, 응답 필드, 사업자등록번호 검색 가능 여부.
  fsc-api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Check FSC APIs with repository secret
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY || vars.DATA_GO_KR_KEY }}
          C_DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY || vars.DATA_GO_KR_API_KEY }}
          C_DATA_GO_KR: ${{ secrets.DATA_GO_KR || vars.DATA_GO_KR }}
          C_DATAGOKR_KEY: ${{ secrets.DATAGOKR_KEY || vars.DATAGOKR_KEY }}
          C_DATA_GO_KEY: ${{ secrets.DATA_GO_KEY || vars.DATA_GO_KEY }}
          C_DATA_API_KEY: ${{ secrets.DATA_API_KEY || vars.DATA_API_KEY }}
          C_PUBLIC_DATA_KEY: ${{ secrets.PUBLIC_DATA_KEY || vars.PUBLIC_DATA_KEY }}
          C_PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY || vars.PUBLIC_DATA_API_KEY }}
          C_SERVICE_KEY: ${{ secrets.SERVICE_KEY || vars.SERVICE_KEY }}
          C_SERVICEKEY: ${{ secrets.SERVICEKEY || vars.SERVICEKEY }}
          C_OPENAPI_KEY: ${{ secrets.OPENAPI_KEY || vars.OPENAPI_KEY }}
          C_OPEN_API_KEY: ${{ secrets.OPEN_API_KEY || vars.OPEN_API_KEY }}
          C_FSC_API_KEY: ${{ secrets.FSC_API_KEY || vars.FSC_API_KEY }}
          C_FSC_KEY: ${{ secrets.FSC_KEY || vars.FSC_KEY }}
          C_CORP_FIN_API_KEY: ${{ secrets.CORP_FIN_API_KEY || vars.CORP_FIN_API_KEY }}
          C_FINANCE_API_KEY: ${{ secrets.FINANCE_API_KEY || vars.FINANCE_API_KEY }}
          C_GOV_API_KEY: ${{ secrets.GOV_API_KEY || vars.GOV_API_KEY }}
          C_DATA_KEY: ${{ secrets.DATA_KEY || vars.DATA_KEY }}
          C_API_KEY: ${{ secrets.API_KEY || vars.API_KEY }}
        run: python scripts/fsc_check.py
