name: Python Tests

# 수집 스크립트를 고친 PR이 실제 수집(매일 07:30 KST)에서 처음 깨지지 않도록, 네트워크 없이 도는 테스트만 실행한다.
on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  # 저장소 Secret FRED_API_KEY로 실제 FRED API를 한 번 호출해 본다 — 키 인식·호출·유동성 시리즈 단위 확인용.
  # 데이터 파일은 쓰지 않는다. 같은 저장소 브랜치의 PR·main push·수동 실행에서만 Secret이 보인다(포크 PR 제외).
  fred-api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # 임시 진단: FRED 키가 어떤 이름으로 저장돼 있는지 찾는다. 이름과 '형식이 FRED 키 같은지'만 출력하고 값은 출력하지 않는다.
      - name: Locate FRED key secret (names only)
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          python - <<'PY'
          import json, os, re
          pat = re.compile(r"^[a-z0-9]{32}$")
          def scan(kind, raw):
              items = json.loads(raw or "{}")
              items.pop("github_token", None)
              rows = []
              for name, value in sorted(items.items()):
                  v = str(value).strip().strip("'\"").strip()
                  looks = bool(pat.match(v))
                  rows.append(f"{name}(len={len(v)}, fred_key_format={'yes' if looks else 'no'})")
              print(f"::notice title={kind}::{len(rows)} - " + "; ".join(rows))
          scan("secrets", os.environ.get("ALL_SECRETS"))
          scan("vars", os.environ.get("ALL_VARS"))
          PY

      - name: Check FRED API with repository secret
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || vars.FRED_API_KEY }}
        run: python scripts/fred_check.py
