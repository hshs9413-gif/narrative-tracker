name: Forecast Check

# 예측 스크립트를 고친 PR과 수동 실행 때만 — 야후에서 어젯밤 미국 장 값을 실제로 받아 예측을 계산해 보여 준다. 커밋하지 않는다.
on:
  pull_request:
    paths:
      - "scripts/compute_forecast.py"
      - "scripts/compute_regression.py"
      - ".github/workflows/forecast_check.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  forecast-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refresh market data (drops unfinished sessions)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || vars.FRED_API_KEY }}
        run: python scripts/collect_market_data.py
        continue-on-error: true
      - name: Compute forecast (not committed)
        run: |
          python scripts/compute_forecast.py | tee /tmp/fc.txt
          echo "::notice title=예측 결과::$(tr '\n' ' ' < /tmp/fc.txt | cut -c1-3000)"
          echo "::notice title=overnight_us.csv::$(wc -l < docs/data/overnight_us.csv)줄, 마지막 3줄 $(tail -3 docs/data/overnight_us.csv | tr '\n' ' ')"
