name: Daily Data Update

on:
  # 1. 정기 실행 (Cron 문법 사용, UTC 기준)
  schedule:
    - cron: '0 0 * * *' # 매일 UTC 자정 (한국 시간 오전 9시) 실행
  
  # 2. 수동 실행 버튼 활성화
  workflow_dispatch: 

# 3. 깃허브 봇이 저장소에 푸시할 수 있도록 쓰기 권한 부여
permissions:
  contents: write 

jobs:
  run-scripts-and-update:
    runs-on: ubuntu-latest

    steps:
    # Step 1: 저장소 코드 가져오기
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: 파이썬 환경 설정
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # 프로젝트에 맞는 파이썬 버전으로 수정

    # Step 3: 필요 라이브러리 설치
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Step 4: 데이터 수집 및 처리 스크립트 실행
    - name: Run Python scripts
      run: |
        python collect_market_data.py
        python collect_news.py
        python propose_updates.py
        # 생성되는 json 파일들이 올바른 경로에 덮어씌워지는지 스크립트 내부 로직 확인 필요

    # Step 5: 변경된 데이터(결과값)를 깃허브에 커밋 및 푸시
    - name: Commit and Push changes
      run: |
        # 깃허브 액션 봇 계정으로 설정
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # 변경된 모든 파일 추가 (새로 생성된 json 파일 등)
        git add .
        
        # 변경 사항이 있을 때만 커밋과 푸시를 진행 (에러 방지)
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 최신 마켓 데이터 및 뉴스 자동 업데이트" && git push)
