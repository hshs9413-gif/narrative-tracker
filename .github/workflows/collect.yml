name: Collect Market Data

on:
  schedule:
    # 매일 22:30 UTC = 한국시간 07:30 (미국 장마감 이후 데이터 확정 후 수집)
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market collector
        run: python scripts/collect_market_data.py

      - name: Run news collector
        run: python scripts/collect_news.py
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "narrative-tracker-bot"
          git config user.email "actions@github.com"
          git add docs/data/market_snapshot.csv docs/data/attention.csv
          git diff --cached --quiet || git commit -m "chore: daily market snapshot $(date -u +%Y-%m-%d)"
          git push
