name: Collect Market Data

on:
  schedule:
    # 매일 22:30 UTC = 한국시간 07:30 (미국 장마감 이후 데이터 확정 후 수집)
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      gemini_force:
        description: "오늘 이미 돌았어도 Gemini 내러티브 정리를 다시 실행"
        type: boolean
        default: false

concurrency:
  group: data-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run market collector
        env:
          # 있으면 FRED 시리즈를 공식 API로 받고 메타데이터(docs/data/fred_series.json)도 갱신한다.
          # 없으면 지금처럼 fdr(fredgraph.csv)로 받는다 — README 'FRED API 키' 참고
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || vars.FRED_API_KEY }}
        run: python scripts/collect_market_data.py

      # 한국 지표(한국은행 기준금리·국고채·외국인 순매수) — 한국은행 ECOS. 키 이름이 달라도 받도록 흔한 이름을 차례로 본다
      - name: Run Korea collector (ECOS)
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY || secrets.BOK_API_KEY || secrets.ECOS_KEY || secrets.BOK_ECOS_API_KEY || secrets.BOK_KEY || secrets.ECOS || secrets.BOK || vars.ECOS_API_KEY }}
        run: python scripts/collect_korea.py
        continue-on-error: true

      - name: Compute regime state
        run: python scripts/compute_regime.py
        # 레짐 판정이 실패해도 그날 시장 데이터 커밋은 반드시 진행되어야 한다
        continue-on-error: true

      - name: Run news collector
        run: python scripts/collect_news.py
        continue-on-error: true

      - name: Auto status transition
        run: python scripts/auto_transition.py
        continue-on-error: true

      # Gemini 무료 모델이 기사 목록을 근거로 내러티브 목록(상태·단계·강도·새 내러티브)과 PMI를 갱신 —
      # 규칙 검사를 통과한 것만 반영하고 모든 제안을 docs/data/narrative_log.json에 남긴다 (scripts/gemini_manage.py)
      - name: Gemini narrative review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FORCE: ${{ inputs.gemini_force && '1' || '' }}
        run: python scripts/gemini_manage.py
        continue-on-error: true
        timeout-minutes: 10

      - name: Recompute regime (PMI may have changed)
        run: python scripts/compute_regime.py
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "narrative-tracker-bot"
          git config user.email "actions@github.com"
          # 파일을 하나씩 나열하면 새 파일(regime_log.csv 등)이 없을 때 git add가 실패해 커밋이 통째로 막힌다
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "chore: daily market snapshot $(date -u +%Y-%m-%d)"
          # 다른 워크플로우가 먼저 push했을 수 있으므로 재시도한다
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push 재시도 $i..."
            sleep 5
          done
          echo "push 실패"; exit 1

      - name: Push settled rows to Google Sheets
        env:
          SHEETS_WEBAPP_URL: ${{ secrets.SHEETS_WEBAPP_URL }}
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
        run: python scripts/push_to_sheets.py
        # 시트는 사본이라 실패해도 수집·커밋에는 영향 없게 한다
        continue-on-error: true
