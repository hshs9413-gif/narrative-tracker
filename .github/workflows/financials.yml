name: Company Financials

# 금융위원회_기업 재무정보 API로 config/companies.json 목록의 요약재무제표·재무상태표·손익계산서를 받아
# docs/data/financials/에 저장한다. 대시보드 '기업 재무' 화면이 이 파일을 읽는다.
# 새 기업 추가: Actions → Company Financials → Run workflow → number에 사업자등록번호 또는 법인등록번호.
on:
  workflow_dispatch:
    inputs:
      number:
        description: "추가할 번호 — 사업자등록번호(10자리) 또는 법인등록번호(13자리), 하이픈 무관, 여러 개면 쉼표. 비우면 목록 전체 갱신"
        required: false
        default: ""
      name:
        description: "회사명 (선택) — 사업자등록번호로 찾을 때 검색에 쓰고 표시 이름으로도 씀"
        required: false
        default: ""
  schedule:
    # 재무제표는 연 단위라 주 1회면 충분 — 매주 월 06:45 KST (일 21:45 UTC)
    - cron: "45 21 * * 0"

concurrency:
  group: data-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Collect company financials
        id: collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY || vars.DATA_GO_KR_KEY }}
          INPUT_NUMBER: ${{ github.event.inputs.number }}
          INPUT_NAME: ${{ github.event.inputs.name }}
        run: python scripts/collect_financials.py --add "$INPUT_NUMBER" --name "$INPUT_NAME"
        # 일부 기업이 실패해도 받은 것은 커밋한다 (실패 사유는 실행 화면의 주석으로 남음)
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "narrative-tracker-bot"
          git config user.email "actions@github.com"
          git add config/companies.json docs/data/financials
          git diff --cached --quiet && exit 0
          git commit -m "chore: company financials $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push 재시도 $i..."
            sleep 5
          done
          echo "push 실패"; exit 1

      - name: Report lookup failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::일부 번호를 찾지 못했거나 수집에 실패했습니다 — 위 주석의 사유를 확인하세요"
          exit 1
