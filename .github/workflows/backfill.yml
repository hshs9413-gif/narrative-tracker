name: Backfill Market History

on:
  workflow_dispatch:
    inputs:
      years:
        description: "years to backfill"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/backfill_market_data.py --years "${{ github.event.inputs.years }}"
      - name: Commit result
        run: |
          git config user.name "narrative-tracker-bot"
          git config user.email "actions@github.com"
          git add docs/data/market_snapshot.csv
          git diff --cached --quiet || git commit -m "chore: backfill market history"
          git push
