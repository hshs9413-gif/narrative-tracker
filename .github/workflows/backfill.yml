name: Backfill Market History

on:
  workflow_dispatch:
    inputs:
      years:
        description: "소급할 연수 (예: 3)"
        required: false
        default: "3"
      start:
        description: "시작일 YYYY-MM-DD (입력 시 years보다 우선)"
        required: false
        default: ""
      merge:
        description: "true면 덮어쓰지 않고 이력 없는 컬럼의 빈칸만 과거치로 채움 (years·start 무시)"
        type: boolean
        default: false
      dry_run:
        description: "merge일 때 파일을 쓰지 않고 채울 개수만 로그에 출력 (먼저 이걸로 확인)"
        type: boolean
        default: false

concurrency:
  group: data-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run backfill
        env:
          # 있으면 FRED 시리즈를 공식 API로 받는다 (없으면 fdr 경로 — README 'FRED API 키' 참고)
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          INPUT_MERGE: ${{ github.event.inputs.merge }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$INPUT_MERGE" = "true" ]; then
            if [ "$INPUT_DRY_RUN" = "true" ]; then
              python scripts/backfill_market_data.py --merge --dry-run
            else
              python scripts/backfill_market_data.py --merge
            fi
          elif [ -n "${{ github.event.inputs.start }}" ]; then
            python scripts/backfill_market_data.py --start "${{ github.event.inputs.start }}"
          else
            python scripts/backfill_market_data.py --years "${{ github.event.inputs.years }}"
          fi

      - name: Commit result
        run: |
          git config user.name "narrative-tracker-bot"
          git config user.email "actions@github.com"
          git add docs/data/market_snapshot.csv
          git diff --cached --quiet && exit 0
          git commit -m "chore: backfill market history"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push 재시도 $i..."
            sleep 5
          done
          echo "push 실패"; exit 1
